services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pricing
      POSTGRES_PASSWORD: pricing
      POSTGRES_DB: pricing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricing -d pricing"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["/app/migrate", "-dir", "/app/migrations"]
    environment:
      DATABASE_URL: "postgres://pricing:pricing@db:5432/pricing?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["/app/api"]
    environment:
      APP_MODE: postgres
      APP_ADDR: ":8080"
      DATABASE_URL: "postgres://pricing:pricing@db:5432/pricing?sslmode=disable"
      BUILD_COMMIT: dev
      BUILD_BUILT_AT: "2026-08-10T00:00:00Z"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run build && npx vite preview --host 0.0.0.0 --port 5173"]
    environment:
      VITE_API_BASE: /api/v1
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - api

  seed:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["/app/seed", "-out", "/data/fixtures", "-profile", "medium"]
    volumes:
      - ./testdata/fixtures:/data/fixtures
    depends_on:
      - db

volumes:
  pgdata:
